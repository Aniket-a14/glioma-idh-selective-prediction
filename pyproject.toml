[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "glioma-selective"
version = "0.1.0"
description = "Calibrated selective prediction for MRI-based glioma IDH classification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Config system decision: docs/research/DECISION_LOG.md D-013.
    "hydra-core>=1.3,<2",
    "omegaconf>=2.3,<3",
    # Phase 01 T01.5 (docs/research/DECISION_LOG.md D-017): pinned against the
    # measured home-GPU-server driver (CUDA 13.2 max, Turing/compute 7.5) and
    # expected to remain compatible once NVIDIA Labs A100 access exists (Ampere,
    # any recent CUDA). No GPU-specific lower bound is hard-coded here; MONAI's
    # own floor governs.
    "torch>=2.4,<3",
    "monai>=1.4,<2",
    # Phase 03 T03.5 (docs/research/DECISION_LOG.md D-020): BraTS-2021's official
    # TCIA-mapping crosswalk ships only as .xlsx. openpyxl alone (no pandas) is
    # the minimal reader for one small, read-only spreadsheet.
    "openpyxl>=3.1,<4",
    # Phase 04 (docs/research/DECISION_LOG.md D-024, D-025): volume I/O, rigid
    # registration/N4/resampling (SimpleITK), and the pinned HD-BET skull-stripper.
    # HD-BET is pinned exactly because the skull-strip release must not change
    # mid-cohort.
    "SimpleITK>=2.4,<3",
    "nibabel>=5,<6",
    "hd-bet==2.0.1",
    # Phase 04 QC overlay figures (D-028). Already in the lock as a transitive
    # dependency; declared here because src/ imports it directly.
    "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = [
    "codespell",
    "detect-secrets",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "radon",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests", "scripts"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["glioma_selective"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
markers = [
    "gpu: requires CUDA or another GPU accelerator",
    "integration: crosses a package or process boundary",
    "slow: takes materially longer than the unit-test suite",
]

[tool.coverage.run]
branch = true
source = ["glioma_selective"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.12"
files = ["src/glioma_selective"]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true

# Radon does not currently consume a native pyproject configuration table.
# These thresholds are kept here as the repository policy and are enforced by
# the Gate B command in .github/workflows/gate_b.yml.
[tool.glioma_selective.quality]
radon_max_cyclomatic_complexity = 10
radon_min_maintainability_index = 50
