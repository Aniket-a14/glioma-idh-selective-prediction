# Phase 06 training defaults (T06.6). Model selection uses the UTSW calibration
# split only (SI-08). Learning rate, batch size and accumulation are sized by the
# pilot run on the training split (T06.9); the stopping rule is fixed here and
# recorded in D-039 so it cannot be tuned after results are seen.
seed: 0
max_epochs: 300
batch_size: 2
accumulation_steps: 4          # optimizer step every 4 batches, effective batch 8
learning_rate: 3.0e-4
weight_decay: 1.0e-4
grad_clip_norm: 1.0
amp: bf16                      # off | bf16 | fp16 (fp16 uses a GradScaler, CUDA only)
seg_weight: 1.0
dice_smooth: 1.0
early_stopping_patience: 30    # epochs without a better calibration-split loss
early_stopping_min_delta: 0.0
checkpoint_every_steps: 0      # 0 = only at epoch boundaries; N = every N optimizer steps
modality_dropout: false        # R1 trains without it; R2-R6 set true (D-041)
modality_dropout_keep_all_probability: 0.5   # otherwise one of the 14 non-empty proper subsets, uniformly
deterministic: true            # deterministic cuDNN/torch algorithms so resume is exact (D-040)
